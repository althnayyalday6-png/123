services:
  - type: web
    name: orbit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - {key: BOT_TOKEN, sync: false}
      - {key: CLIENT_ID, sync: false}
      - {key: CLIENT_SECRET, sync: false}
      - {key: OWNER_ID, sync: false}
      - {key: BASE_URL, sync: false}
      - {key: SESSION_SECRET, generateValue: true}
